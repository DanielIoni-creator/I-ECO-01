<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAZ Poster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
    }
    .poster {
      width: 500px;
      background: linear-gradient(135deg, #0A0A0A, #1A0033);
      border: 2px solid #8B00FF;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: #FFFFFF;
      box-shadow: 0 0 50px rgba(139,0,255,0.3);
    }
    .laser { color: #8B00FF; font-size: 4em; text-shadow: 0 0 20px rgba(139,0,255,0.8); }
    .title { font-size: 2.5em; font-weight: 900; letter-spacing: 4px; }
    .date { color: #8B00FF; font-size: 1.3em; border: 1px solid #8B00FF; border-radius: 50px; padding: 10px 20px; display: inline-block; margin: 15px 0; }
    .xmr { color: #8B00FF; font-weight: 700; margin-top: 15px; }
    .footer { margin-top: 30px; font-size: 0.7em; color: #666; border-top: 1px solid #333; padding-top: 20px; }
  </style>
</head>
<body>
  <div class="poster">
    <div class="laser">⚡</div>
    <div class="title">TAZ</div>
    <div class="date">📅 16 AGOSTO 2026</div>
    <div class="xmr">💰 PAGA IN XMR · PRIVACY NON È UN CRIMINE</div>
    <div class="footer">#MyZubster · #TAZ · #XMR · #OpenSource</div>
  </div>
</body>
</html>
