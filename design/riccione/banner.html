<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  padding: 0;
  background: #0A0A0A;
  font-family: 'Orbitron', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.banner {
  width: 2000px;
  height: 1000px;
  background: linear-gradient(135deg, #0A0A0A 0%, #1A0033 100%);
  border: 3px solid #8B00FF;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px;
  box-shadow: 0 0 100px rgba(139, 0, 255, 0.3);
}
h1 {
  font-size: 120px;
  color: #FF6600;
  margin: 0;
  text-shadow: 0 0 40px rgba(255, 102, 0, 0.5);
  letter-spacing: 10px;
}
.subtitle {
  font-size: 48px;
  color: #8B00FF;
  margin: 10px 0;
  letter-spacing: 5px;
}
.details {
  font-size: 32px;
  color: #C0C0C0;
  margin: 15px 0;
}
.xmr {
  font-size: 64px;
  color: #FF6600;
  font-weight: 900;
  margin: 10px 0;
  text-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
}
.features {
  display: flex;
  gap: 60px;
  margin: 20px 0;
  font-size: 28px;
  color: #FFFFFF;
}
.feature {
  padding: 10px 30px;
  border: 2px solid #8B00FF;
  border-radius: 50px;
  background: rgba(139, 0, 255, 0.1);
}
.footer {
  margin-top: 30px;
  font-size: 20px;
  color: #666;
  letter-spacing: 3px;
  border-top: 1px solid #333;
  padding-top: 20px;
  width: 80%;
}
</style>
</head>
<body>
<div class="banner">
  <h1>⚡ TAZ DAY</h1>
  <div class="subtitle">MyZubster x Riccione</div>
  <div class="details">📅 Settembre 2026 · 📍 Piazza Riccione</div>
  <div class="xmr">💰 PAGA IN XMR</div>
  <div class="features">
    <span class="feature">🤖 Bar Robotico</span>
    <span class="feature">🌱 Orti DAO</span>
    <span class="feature">🎤 Talk</span>
  </div>
  <div class="footer">#MyZubster · #TAZ · #XMR · #OpenSource · #Riccione</div>
</div>
</body>
</html>
