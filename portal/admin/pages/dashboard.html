<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Admin Dashboard - MyZubster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 24px;
            color: #8b5cf6;
        }

        .header-title span {
            font-size: 14px;
            color: #888;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-export {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(139, 92, 246, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-export:hover {
            background: rgba(139, 92, 246, 0.3);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #8b5cf6;
        }

        .stat-card .stat-label {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .stat-card .stat-change {
            font-size: 12px;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: #4caf50;
        }

        .stat-change.negative {
            color: #f44336;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .chart-card h3 {
            margin-bottom: 16px;
            color: #aaa;
        }

        .chart-placeholder {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        /* Activity Feed */
        .activity-feed {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .activity-feed h3 {
            margin-bottom: 16px;
            color: #aaa;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            font-size: 20px;
        }

        .activity-content {
            flex: 1;
        }

        .activity-content .activity-description {
            font-size: 14px;
        }

        .activity-content .activity-time {
            font-size: 12px;
            color: #666;
        }

        .activity-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .activity-status.completed {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .activity-status.pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-title">
                <h1>📊 Admin Dashboard</h1>
                <span id="lastUpdate">Aggiornato: 2026-08-12 04:30:00</span>
            </div>
            <div class="header-actions">
                <button class="btn-export" onclick="exportReport()">📥 Esporta Report</button>
                <button class="btn-export" onclick="refreshData()">🔄 Aggiorna</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalPayments">0</div>
                <div class="stat-label">💰 Pagamenti Totali</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAmount">0</div>
                <div class="stat-label">💵 Totale Incassato</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPlants">0</div>
                <div class="stat-label">🌿 Piante Registrate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingPayments">0</div>
                <div class="stat-label">⏳ Pagamenti in Attesa</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Revenue Mensile</h3>
                <div class="chart-placeholder" id="monthlyChart">
                    [Grafico Revenue Mensile]
                </div>
            </div>
            <div class="chart-card">
                <h3>🌿 Piante per Epoca</h3>
                <div class="chart-placeholder" id="eraChart">
                    [Grafico Piante per Epoca]
                </div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-feed">
            <h3>📋 Attività Recenti</h3>
            <div id="activityFeed"></div>
        </div>
    </div>

    <script>
        // Carica i dati della dashboard
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // Aggiorna statistiche
                    document.getElementById('totalPayments').textContent = data.totalPayments || 0;
                    document.getElementById('totalAmount').textContent = data.totalAmount ? data.totalAmount.toFixed(2) : '0';
                    document.getElementById('totalPlants').textContent = data.totalPlants || 0;
                    document.getElementById('pendingPayments').textContent = data.pendingPayments || 0;
                    
                    // Aggiorna attività
                    const feed = document.getElementById('activityFeed');
                    feed.innerHTML = '';
                    
                    if (data.recentActivity && data.recentActivity.length > 0) {
                        data.recentActivity.forEach(activity => {
                            const item = document.createElement('div');
                            item.className = 'activity-item';
                            
                            const icon = activity.type === 'payment' ? '💰' : '🌿';
                            const status = activity.status || 'completed';
                            
                            item.innerHTML = `
                                <span class="activity-icon">${icon}</span>
                                <div class="activity-content">
                                    <div class="activity-description">${activity.description}</div>
                                    <div class="activity-time">${new Date(activity.timestamp).toLocaleString()}</div>
                                </div>
                                <span class="activity-status ${status}">${status}</span>
                            `;
                            
                            feed.appendChild(item);
                        });
                    } else {
                        feed.innerHTML = '<p style="color: #666; text-align: center;">Nessuna attività recente</p>';
                    }
                    
                    // Aggiorna timestamp
                    document.getElementById('lastUpdate').textContent = 
                        `Aggiornato: ${new Date().toLocaleString()}`;
                }
            } catch (error) {
                console.error('Errore caricamento dashboard:', error);
            }
        }

        // Esporta report
        async function exportReport() {
            try {
                const response = await fetch('/api/dashboard/export');
                const result = await response.json();
                
                if (result.success) {
                    const blob = new Blob(
                        [JSON.stringify(result.data, null, 2)],
                        { type: 'application/json' }
                    );
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `report-${new Date().toISOString()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            } catch (error) {
                console.error('Errore esportazione:', error);
                alert('Errore durante l\'esportazione del report');
            }
        }

        // Refresh dati
        function refreshData() {
            loadDashboard();
        }

        // Carica dashboard all'avvio
        document.addEventListener('DOMContentLoaded', loadDashboard);
        
        // Refresh automatico ogni 30 secondi
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
