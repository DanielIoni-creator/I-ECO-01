<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👽 Pytho Chat - MyZubster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .chat-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header .alien { font-size: 4rem; animation: float 3s ease-in-out infinite; display: block; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .header h1 { font-size: 2rem; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 5px 0; }
        .header p { opacity: 0.6; font-size: 0.9rem; }
        .chat-box { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 20px; height: 400px; overflow-y: auto; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .message { margin: 8px 0; padding: 10px 15px; border-radius: 15px; max-width: 85%; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { background: linear-gradient(135deg, #a855f7, #ec4899); margin-left: auto; border-bottom-right-radius: 5px; }
        .message.pytho { background: rgba(255,255,255,0.1); margin-right: auto; border-bottom-left-radius: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .message .sender { font-size: 0.7rem; opacity: 0.5; margin-bottom: 3px; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; outline: none; }
        .input-area input::placeholder { color: rgba(255,255,255,0.3); }
        .input-area button { padding: 12px 25px; border-radius: 25px; border: none; background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; font-weight: bold; cursor: pointer; transition: transform 0.2s ease; }
        .input-area button:hover { transform: scale(1.05); }
        .quick-questions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
        .quick-questions button { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; }
        .quick-questions button:hover { background: rgba(168,85,247,0.2); border-color: #a855f7; color: #fff; }
        .typing { color: rgba(255,255,255,0.3); font-size: 0.8rem; padding: 5px 15px; display: none; }
        .footer { text-align: center; opacity: 0.3; font-size: 0.7rem; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <span class="alien">👽</span>
            <h1>Pytho Chat</h1>
            <p>🌿 Il tuo alieno giardiniere</p>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message pytho">
                <div class="sender">👽 Pytho</div>
                Ciao! Sono Pytho, l'alieno giardiniere. 🌿<br>
                Chiedimi consigli su orto, piante, MYZ, Monero o le ultime notizie!
            </div>
        </div>
        <div class="typing" id="typing">👽 Pytho sta scrivendo...</div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Chiedi a Pytho..." />
            <button id="sendBtn">🚀 Invia</button>
        </div>
        <div class="quick-questions">
            <button onclick="askPytho('Come coltivo i pomodori?')">🍅 Pomodori</button>
            <button onclick="askPytho('Cosa sono gli MYZ?')">🪙 MYZ</button>
            <button onclick="askPytho('Cos\'è Monero?')">🔶 Monero</button>
            <button onclick="askPytho('Ultime notizie su Monero?')">📰 Notizie</button>
            <button onclick="askPytho('Chi è Fluffypony?')">🐴 Fluffypony</button>
        </div>
        <div class="footer">👽 Pytho — Open Source</div>
    </div>
    <script>
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }
        function addMessage(sender, text, isPytho = false) {
            const div = document.createElement('div');
            div.className = `message ${isPytho ? 'pytho' : 'user'}`;
            div.innerHTML = `<div class="sender">${isPytho ? '👽 Pytho' : '🧑 Tu'}</div>${text}`;
            chatBox.appendChild(div);
            scrollToBottom();
        }
        function showTyping(show) { typing.style.display = show ? 'block' : 'none'; scrollToBottom(); }
        async function askPytho(message) {
            if (!message || message.trim() === '') return;
            addMessage('Tu', message, false);
            input.value = '';
            showTyping(true);
            try {
                const response = await fetch('/api/pytho/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                showTyping(false);
                if (data.success) { addMessage('Pytho', data.response, true); }
                else { addMessage('Pytho', '👽 Mi dispiace, ho avuto un problema. Riprova più tardi.', true); }
            } catch (error) {
                showTyping(false);
                addMessage('Pytho', '👽 Errore di connessione. Riprova più tardi.', true);
            }
        }
        sendBtn.addEventListener('click', () => { const message = input.value.trim(); if (message) askPytho(message); });
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') { const message = input.value.trim(); if (message) askPytho(message); } });
    </script>
</body>
</html>
