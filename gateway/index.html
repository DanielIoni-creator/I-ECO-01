<!DOCTYPE html>
<html>
<head><title>👽 Pytho</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    font-family:sans-serif;
    color:#fff;
}
.container {
    text-align:center;
    padding:50px;
    background:rgba(255,255,255,0.05);
    border-radius:30px;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    max-width:600px;
}
.alien { font-size:7rem; animation:float 3s infinite; display:block; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
h1 { font-size:3.5rem; background:linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.links a {
    color:#a855f7;
    text-decoration:none;
    padding:8px 16px;
    border:1px solid rgba(168,85,247,0.3);
    border-radius:20px;
    display:inline-block;
    margin:5px;
}
.links a:hover { background:rgba(168,85,247,0.2); }
</style>
</head>
<body>
<div class="container">
    <span class="alien">👽</span>
    <h1>PYTHO</h1>
    <p>🛸 The MyZubster Alien</p>
    <div style="margin:20px 0;padding:10px 25px;background:rgba(34,197,94,0.2);border-radius:50px;display:inline-block;">✅ Gateway Online</div>
    <div class="links">
        <a href="/api/dashboard">📊 Dashboard</a>
        <a href="/temporal">⏳ Macchina del Tempo</a>
    </div>
    <div style="margin-top:30px;opacity:0.4;font-size:0.8rem;">👽 Pytho watches over you</div>
</div>
</body>
</html>
